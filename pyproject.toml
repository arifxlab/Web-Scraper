[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'


[tool.ruff]
line-length = 88
target-version = "py311"

exclude = [
    ".git",
    ".idea",
    ".pytest_cache",
    ".venv",
    "__pycache__",
    "data",
    "logs",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
]

ignore = [
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"